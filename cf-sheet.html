<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codeforces Problem Tracker</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f5f4ee;--panel:#fffdf9;--sunk:#efede3;--line:#e3e0d3;--ink:#1f1e1b;--muted:#6f6c61;--accent:#d97757;--accent-d:#bf5b3b;--accent-s:#f8e3d9;--ok:#6b8a4e;--ok-s:#e6edd9;--star:#d9a43a;--r:14px;--sh:0 1px 2px rgba(60,40,20,.06),0 8px 24px -12px rgba(60,40,20,.14);--serif:"Tiempos Headline","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=dark]{--bg:#1c1b19;--panel:#262521;--sunk:#2e2d29;--line:#3a3833;--ink:#f1eee4;--muted:#a29f93;--accent:#e0866a;--accent-d:#ee9c82;--accent-s:#3d2a22;--ok:#9bb97c;--ok-s:#2c3324;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(88px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding:0 env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header.hero{padding:calc(40px + env(safe-area-inset-top,0px)) 0 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:36px;align-items:center}
h1{font:500 clamp(36px,6vw,60px)/1.04 var(--serif);letter-spacing:-.02em;margin:0 0 10px}
.lede{color:var(--muted);margin:0 0 22px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.stat b{display:block;font:500 28px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.ring{position:relative;width:176px;height:176px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .tr{stroke:var(--sunk)}.ring .fg{stroke:var(--accent);stroke-dasharray:408.4;stroke-dashoffset:408.4;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font:500 40px/1 var(--serif)}.ring small{color:var(--muted)}
.bar-all{height:6px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-top:18px}.bar-all i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s}
.ctl{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.ctl .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;height:42px;padding:0 44px 0 40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.search svg{position:absolute;left:13px;top:12px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:9px;font:12px var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--sunk)}
.seg{display:flex;background:var(--sunk);padding:3px;border-radius:12px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;color:var(--muted);font-size:14px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.btn{height:42px;padding:0 14px;border:1px solid var(--line);background:var(--panel);border-radius:12px;display:inline-flex;align-items:center;gap:7px;font-size:14px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.btn.pri:hover{background:var(--accent-d)}
.btn.ic{width:42px;padding:0;justify-content:center}.btn.dng:hover{color:#b3402a;border-color:#b3402a}
.menu{position:relative}.menu .pop{display:none;position:absolute;right:0;top:48px;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:6px;z-index:30}
.menu.open .pop{display:block}.pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-size:14px}.pop button:hover{background:var(--sunk)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips a{--p:0%;flex:none;text-decoration:none;color:var(--ink);font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:linear-gradient(90deg,var(--accent-s) var(--p),var(--panel) var(--p));white-space:nowrap}
.chips a:hover{border-color:var(--accent)}.chips a.full{border-color:var(--ok);color:var(--ok)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:14px 2px 12px}
.cat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;box-shadow:var(--sh);content-visibility:auto;contain-intrinsic-size:auto 400px}
.cat.gone{display:none}
.cat summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px}
.cat summary::-webkit-details-marker{display:none}
.caret{width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(-45deg);transition:transform .2s;flex:none}
.cat[open] .caret{transform:rotate(45deg)}
.cn{font:500 20px/1.2 var(--serif);flex:1;min-width:0}
.mini{width:110px;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;flex:none}.mini i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.cc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}.cc.done{color:var(--ok);font-weight:600}
.rows{list-style:none;margin:0;padding:0 8px 8px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:34px 74px 1fr auto auto 34px;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;margin-top:4px;transition:background .15s}
.row:hover{background:var(--sunk)}.row.s{background:var(--ok-s)}.row.hide{display:none}
.row.flash{animation:fl 1.6s}@keyframes fl{0%,60%{background:var(--accent-s);box-shadow:0 0 0 2px var(--accent)}}
.ix{color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.cd{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--sunk);border-radius:7px;padding:3px 8px;text-align:center}
.row.s .cd{background:var(--panel);color:var(--ok)}
.tt{color:var(--ink);text-decoration:none;min-width:0;overflow-wrap:anywhere}.tt:hover{color:var(--accent-d);text-decoration:underline;text-underline-offset:3px}
.row.s .tt{color:var(--muted)}
.src{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.src:empty{display:none}
.star{border:0;background:none;color:var(--line);font-size:18px;line-height:1;padding:4px;border-radius:8px}.star:hover{color:var(--star)}.star.on{color:var(--star)}
.chk{width:26px;height:26px;border-radius:8px;border:1.8px solid var(--muted);background:var(--panel);display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s,transform .15s}
.chk svg{opacity:0;transform:scale(.4);transition:.18s}.row.s .chk{background:var(--ok);border-color:var(--ok);transform:scale(1.05)}.row.s .chk svg{opacity:1;transform:none}
.empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}.empty h3{font:500 24px var(--serif);color:var(--ink);margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted);font-size:13px;text-align:center;padding:30px 0 50px}
@media(max-width:760px){.hero-grid{grid-template-columns:1fr}.ring{order:-1;width:140px;height:140px}.ring b{font-size:32px}.stats{grid-template-columns:repeat(2,1fr)}.mini{display:none}.btn .lb{display:none}.btn{padding:0;width:42px;justify-content:center}.btn.pri{width:auto;padding:0 14px}.btn.pri .lb{display:inline}}
@media(max-width:560px){.wrap{padding:0 14px}.row{grid-template-columns:62px 1fr auto 30px;gap:8px}.ix,.row .src{display:none}.seg button{padding:7px 9px}.cn{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>

<div class="ctl"><div class="wrap">

    <div class="pop"><button id="exp">Expand all topics</button><button id="col">Collapse all topics</button><button id="out">Export progress</button><button id="inp">Import progress</button><button id="rst" style="color:#b3402a">Reset everything</button></div>
    <input type="file" id="file" accept="application/json" hidden></div>
</div></div>

<main class="wrap">
  <nav class="chips" id="chips" aria-label="Topics"></nav>

  <div class="empty" id="empty"><h3>No problems match</h3><p>Try a different search or switch the filter back to All.</p></div>
  <div class="foot">Progress saves automatically in this browser.</div>
</main>

<script>
(function(){

function src(u){return/spoj\.com/.test(u)?"SPOJ":/cses\.fi/.test(u)?"CSES":""}
function day(t){var d=new Date(t);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}
var tm;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tm);tm=setTimeout(function(){t.classList.remove("show")},2400)}

// theme
var th=localStorage.getItem(TK)||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
function setTheme(v){document.documentElement.dataset.theme=v;try{localStorage.setItem(TK,v)}catch(e){}}
setTheme(th);$("theme").onclick=function(){setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark")};

// build
P.forEach(function(p){(map[p.category]=map[p.category]||(order.push(p.category),[])).push(p)});

  var id="c-"+slug(c);
  chips+='<a href="#'+id+'" data-c="'+esc(c)+'">'+esc(c)+'</a>';
  html+='<details class="cat" open id="'+id+'" data-c="'+esc(c)+'"><summary><i class="caret"></i><span class="cn">'+esc(c)+'</span><span class="mini"><i></i></span><span class="cc"></span></summary><ul class="rows">';
  map[c].forEach(function(p){
    html+='<li class="row" data-id="'+p.id+'" data-q="'+esc((p.title+" "+p.code+" "+p.category).toLowerCase())+'"><span class="ix">'+p.id+'</span><span class="cd">'+esc(p.code)+'</span><a class="tt" href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+esc(p.title)+'</a><span class="src">'+src(p.url)+'</span><button class="star" aria-label="Star problem" title="Star to revisit">&#9733;</button><button class="chk" role="checkbox" aria-label="Mark solved">'+CHECK+'</button></li>';
  });
  html+='</ul></details>';
});

// stats
var C=2*Math.PI*65;
function streakOf(){var days={},n=0,d=new Date();Object.keys(S.solved).forEach(function(k){var v=S.solved[k];if(typeof v==="number")days[day(v)]=1});
  if(!days[day(d)])d.setDate(d.getDate()-1);while(days[day(d)]){n++;d.setDate(d.getDate()-1)}return n}
function stats(){
  var n=Object.keys(S.solved).length,t=P.length,pc=t?Math.round(n/t*100):0,td=0,now=day(Date.now());
  Object.keys(S.solved).forEach(function(k){var v=S.solved[k];if(typeof v==="number"&&day(v)===now)td++});
  $("sSolved").textContent=n;$("sLeft").textContent=t-n;$("sToday").textContent=td;$("sStreak").textContent=streakOf();
  $("pct").textContent=pc+"%";$("fg").style.strokeDashoffset=C*(1-n/(t||1));
  order.forEach(function(c){var a=map[c],d=0;a.forEach(function(p){if(S.solved[p.id])d++});
    cc[c].textContent=d+" / "+a.length;cc[c].classList.toggle("done",d===a.length);
    var w=Math.round(d/a.length*100);mini[c].style.width=w+"%";chipEl[c].style.setProperty("--p",w+"%");chipEl[c].classList.toggle("full",d===a.length)});

function paint(id){var el=rows[id];el.classList.toggle("s",!!S.solved[id]);el.classList.toggle("st",!!S.star[id]);el.querySelector(".star").classList.toggle("on",!!S.star[id]);
  el.querySelector(".chk").setAttribute("aria-checked",!!S.solved[id])}
function paintAll(){P.forEach(function(p){paint(p.id)})}

// filter
var F="all",Q="";
function filter(){
  var shown=0,per={};order.forEach(function(c){per[c]=0});
  P.forEach(function(p){var el=rows[p.id],s=!!S.solved[p.id];
    var ok=(F==="all"||(F==="done"&&s)||(F==="todo"&&!s)||(F==="star"&&S.star[p.id]))&&(!Q||el.dataset.q.indexOf(Q)>-1);
    el.classList.toggle("hide",!ok);if(ok){shown++;per[p.category]++}});
  var active=F!=="all"||Q;
  order.forEach(function(c){dets[c].classList.toggle("gone",!per[c]);if(active)dets[c].open=per[c]>0});
  $("empty").style.display=shown?"none":"block";

}

// interactions (delegated)
function flip(id){

  if(S.solved[id]){delete S.solved[id]}else{S.solved[id]=Date.now();
    var a=map[cat],d=a.every(function(p){return S.solved[p.id]});if(d)toast("Topic complete: "+cat)}
  paint(id);save();stats();if(F==="todo"||F==="done")filter()}
$("cats").addEventListener("click",function(e){
  var row=e.target.closest(".row");if(!row||e.target.closest("a"))return;var id=row.dataset.id;
  if(e.target.closest(".star")){if(S.star[id])delete S.star[id];else S.star[id]=1;paint(id);save();if(F==="star")filter();return}
  flip(id)});
$("chips").addEventListener("click",function(e){var a=e.target.closest("a");if(!a)return;e.preventDefault();var d=dets[a.dataset.c];d.classList.remove("gone");d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"});history.replaceState(null,"",a.getAttribute("href"))});

// random pick
function pick(){
  var c=P.filter(function(p){return!S.solved[p.id]&&!rows[p.id].classList.contains("hide")});
  if(!c.length){toast("Nothing left to pick. Nice work!");return}
  var p=c[Math.floor(Math.random()*c.length)],el=rows[p.id];dets[p.category].open=true;
  el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");toast("Try "+p.code+": "+p.title)}
$("rnd").onclick=pick;

// menu
var menu=$("menu");$("mbtn").onclick=function(e){e.stopPropagation();menu.classList.toggle("open")};
document.addEventListener("click",function(){menu.classList.remove("open")});
$("exp").onclick=function(){order.forEach(function(c){dets[c].open=true})};
$("col").onclick=function(){order.forEach(function(c){dets[c].open=false})};
$("out").onclick=function(){var b=new Blob([JSON.stringify({solved:S.solved,star:S.star,exportedAt:new Date().toISOString(),total:P.length},null,1)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="cf-tracker-progress.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);toast("Progress exported")};
$("inp").onclick=function(){$("file").click()};
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var j=JSON.parse(rd.result);if(!j||typeof j.solved!=="object")throw 0;S.solved=j.solved;S.star=j.star||{};save();paintAll();stats();filter();toast("Progress imported")}catch(x){toast("That file isn't a valid progress export")}};rd.readAsText(f);e.target.value=""};
$("rst").onclick=function(){if(confirm("Clear all solved and starred problems? This can't be undone.")){S={solved:{},star:{}};save();paintAll();stats();filter();toast("Progress cleared")}};

// shortcuts
document.addEventListener("keydown",function(e){var t=e.target.tagName;
  if(e.key==="Escape"){menu.classList.remove("open");if(t==="INPUT"){e.target.blur()}return}
  if(t==="INPUT"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="/"){e.preventDefault();$("q").focus()}else if(e.key==="r"||e.key==="R")pick()});

paintAll();stats();filter();
})();
</script>
</body>
</html>
